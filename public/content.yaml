about:
  name: Sima Ghaddar
  photoUrl: /sima.jpeg
  photoAlt: Sima Ghaddar
  bio:
    - "I am a political sociologist and ethnographer of humanitarianism, governance, and gender. My book project, <em>Brokers of the Humanitarian Interface</em>, examines the effect of the humanitarian apparatus on local governance structures at the point of encounter with communities in crisis in contemporary Lebanon. Based on eighteen months of ethnographic fieldwork in the popular quarters of Wadi Al-Nahleh- Mankoubin in Tripoli, it explores the rise of new NGOs, self-styled \"humanitarian entrepreneurs,\" and gendered aid architectures. I use the Lebanese case to investigate broader questions about how humanitarian governance is remaking local political authority and gender relations across the Global South."

